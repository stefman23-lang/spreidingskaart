const TYPE_META={VO:{kleur:'#6A3D9A',shape:'circle',label:'VO'},MBO:{kleur:'#C42B78',shape:'circle',label:'MBO'},LERAAR:{kleur:'#128C8C',shape:'diamond',label:'Lerarenopleiding'}};
let activeTypes={VO:true,MBO:true,LERAAR:true};
let searchCircle=null,searchCenter=null,searchRadiusKm=null;
const markerById={};let closeTimer=null,hlId=null;

const map=L.map('map',{center:[52.66,4.90],zoom:9,zoomControl:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap · © CARTO',subdomains:'abcd',maxZoom:18}).addTo(map);
const cluster=L.markerClusterGroup({spiderfyOnMaxZoom:true,showCoverageOnHover:false,zoomToBoundsOnClick:true,maxClusterRadius:45,spiderLegColor:'#9a8cc0'});
map.addLayer(cluster);

function makeIcon(rec,hl){const m=TYPE_META[rec.type];
  return L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-13],
    html:`<div class="mk-outer ${hl?'hl':''}" style="width:22px;height:22px"><div class="mk ${m.shape} mk-${rec.type.toLowerCase()}"></div></div>`});}
function haversine(a,b,c,d){const R=6371,dLat=(c-a)*Math.PI/180,dLon=(d-b)*Math.PI/180;const s=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function passesFilter(rec){if(!activeTypes[rec.type])return false;if(searchCenter){if(haversine(searchCenter[0],searchCenter[1],rec.lat,rec.lon)>searchRadiusKm)return false;}return true;}

function buildPopup(rec){const m=TYPE_META[rec.type];
  let rows='';
  if(rec.aanbod) rows+=`<div class="pop-row"><span class="pop-k">Aanbod</span><span class="pop-v">${rec.aanbod}</span></div>`;
  rows+=`<div class="pop-row"><span class="pop-k">Plaats</span><span class="pop-v">${rec.gemeente}</span></div>`;
  if(rec.adres) rows+=`<div class="pop-row"><span class="pop-k">Adres</span><span class="pop-v">${rec.adres}${rec.postcode?', '+rec.postcode:''}</span></div>`;
  rows+=`<div class="pop-row"><span class="pop-k">Bestuur</span><span class="pop-v">${rec.bestuur}</span></div>`;
  const link=rec.website?`<a class="pop-link" href="${rec.website}" target="_blank" rel="noopener">Naar de website van de school →</a>`
                        :`<span class="pop-nolink">Geen website bekend</span>`;
  return `<div class="pop-head" style="background:${m.kleur}"><span class="pop-badge">${m.label} · opleidingsschool</span><h3>${rec.naam}</h3></div><div class="pop-body">${rows}${link}</div>`;
}

function rebuild(){
  cluster.clearLayers();
  const active=RECORDS.filter(passesFilter);
  const markers=active.map(rec=>{
    const mk=L.marker([rec.lat,rec.lon],{icon:makeIcon(rec,false)});
    mk.bindPopup(buildPopup(rec),{maxWidth:280,closeButton:false,autoClose:true,closeOnClick:false});
    mk.on('mouseover',()=>{clearTimeout(closeTimer);highlight(rec.id);mk.openPopup();});
    mk.on('mouseout',()=>{closeTimer=setTimeout(()=>{mk.closePopup();highlight(null);},350);});
    mk.on('popupopen',e=>{const el=e.popup.getElement();if(!el)return;
      el.addEventListener('mouseenter',()=>clearTimeout(closeTimer));
      el.addEventListener('mouseleave',()=>{closeTimer=setTimeout(()=>{mk.closePopup();highlight(null);},250);});});
    markerById[rec.id]=mk;return mk;
  });
  cluster.addLayers(markers);
  document.getElementById('s-shown').textContent=active.length;
}
function highlight(id){
  if(hlId===id)return;
  const prev=hlId;hlId=id;
  [prev,id].forEach(x=>{if(x==null)return;const rec=RECORDS.find(r=>r.id===x);const mk=markerById[x];if(rec&&mk)mk.setIcon(makeIcon(rec,x===hlId));});
}
function toggleType(t){activeTypes[t]=!activeTypes[t];document.querySelector(`.pill[data-type="${t}"]`).classList.toggle('off',!activeTypes[t]);rebuild();}

async function doSearch(){
  const raw=document.getElementById('pc-input').value.trim();const msg=document.getElementById('pc-msg');
  if(!raw){msg.textContent='Vul een postcode in.';return;}
  msg.textContent='Zoeken…';const pc=raw.replace(/\s+/g,'').toUpperCase();
  try{
    const url='https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?q='+encodeURIComponent(pc)+'&fq=type:postcode&rows=1';
    const res=await fetch(url);const j=await res.json();const docs=j.response&&j.response.docs;
    if(!docs||!docs.length){msg.textContent='Postcode niet gevonden.';return;}
    const pt=docs[0].centroide_ll.match(/POINT\(([-\d.]+) ([-\d.]+)\)/);const lon=parseFloat(pt[1]),lat=parseFloat(pt[2]);
    searchCenter=[lat,lon];searchRadiusKm=parseInt(document.getElementById('radius').value,10);
    if(searchCircle)map.removeLayer(searchCircle);
    searchCircle=L.circle([lat,lon],{radius:searchRadiusKm*1000,color:'#4A2C82',weight:2,fillColor:'#4A2C82',fillOpacity:0.06,dashArray:'6 5'}).addTo(map);
    L.circleMarker([lat,lon],{radius:6,color:'#fff',weight:2,fillColor:'#4A2C82',fillOpacity:1}).addTo(searchCircle._map).bindTooltip(pc);
    map.fitBounds(searchCircle.getBounds(),{padding:[40,40]});rebuild();
    const n=RECORDS.filter(passesFilter).length;
    msg.textContent=`${n} opleidingsscholen binnen ${searchRadiusKm} km van ${pc}.`;
    document.getElementById('s-region').textContent=`binnen ${searchRadiusKm} km van ${pc}`;
  }catch(e){msg.textContent='Zoeken mislukt, probeer opnieuw.';}
}
function clearSearch(){searchCenter=null;searchRadiusKm=null;if(searchCircle){map.removeLayer(searchCircle);searchCircle=null;}
  document.getElementById('pc-msg').textContent='';document.getElementById('pc-input').value='';
  document.getElementById('s-region').textContent='heel Noord-Holland';rebuild();map.flyTo([52.66,4.90],9,{duration:0.8});}
document.getElementById('pc-input').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
rebuild();
</script>
</body>
</html>
